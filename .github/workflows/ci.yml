name: TicketGate CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: npm run typecheck
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://nokxeuxmhbbnllijnfht.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: sb_publishable_ZnLEvLm_6-BjUfEaHAN_8Q_y3sqQdOQ
      - run: npm run lint
      - run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://nokxeuxmhbbnllijnfht.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: sb_publishable_ZnLEvLm_6-BjUfEaHAN_8Q_y3sqQdOQ
      - name: Build Next.js for Cloudflare Workers (OpenNext)
        run: npx opennextjs-cloudflare build
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://nokxeuxmhbbnllijnfht.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: sb_publishable_ZnLEvLm_6-BjUfEaHAN_8Q_y3sqQdOQ
      - name: Bundle Worker for direct Cloudflare API upload (dry run)
        run: npx wrangler deploy --dry-run --outdir .worker-dist
      - name: Deploy to Cloudflare Workers (only when token secret exists)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: a9b08391a849a2e0804f6c93bb65c251
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "Deployment skipped: add CLOUDFLARE_API_TOKEN in GitHub repository Actions secrets."
          else
            npx wrangler deploy
          fi
      - name: Upload OpenNext build output for inspection
        uses: actions/upload-artifact@v4
        with:
          name: ticketgate-opennext-build
          path: |
            .open-next/
            .worker/
            .worker-dist/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 1

      - name: Seat-lock concurrency test (requires CI secret)
        env:
          SUPABASE_URL: https://nokxeuxmhbbnllijnfht.supabase.co
          SUPABASE_ANON_KEY: sb_publishable_ZnLEvLm_6-BjUfEaHAN_8Q_y3sqQdOQ
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          if [ -z "$SUPABASE_SERVICE_ROLE_KEY" ]; then
            echo "Skipping concurrency test: SUPABASE_SERVICE_ROLE_KEY secret is not configured."
          else
            npm run test:concurrency
          fi
