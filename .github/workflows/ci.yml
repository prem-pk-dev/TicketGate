name: TicketGate CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: npm run typecheck
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://nokxeuxmhbbnllijnfht.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: sb_publishable_ZnLEvLm_6-BjUfEaHAN_8Q_y3sqQdOQ
      - run: npm run lint
      - run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://nokxeuxmhbbnllijnfht.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: sb_publishable_ZnLEvLm_6-BjUfEaHAN_8Q_y3sqQdOQ
      - name: Upload OpenNext build output for account-managed deployment
        uses: actions/upload-artifact@v4
        with:
          name: ticketgate-opennext-build
          path: |
            .open-next/
            .worker/
          if-no-files-found: error
          retention-days: 1

      - name: Seat-lock concurrency test (requires CI secret)
        env:
          SUPABASE_URL: https://nokxeuxmhbbnllijnfht.supabase.co
          SUPABASE_ANON_KEY: sb_publishable_ZnLEvLm_6-BjUfEaHAN_8Q_y3sqQdOQ
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          if [ -z "$SUPABASE_SERVICE_ROLE_KEY" ]; then
            echo "Skipping concurrency test: SUPABASE_SERVICE_ROLE_KEY secret is not configured."
          else
            npm run test:concurrency
          fi
